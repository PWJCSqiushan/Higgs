[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "r-agent"
version = "0.2.0"
description = "Fail-closed QQ agent core with shadow ingestion and controlled replies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "R Agent Project" }]
dependencies = [
  "httpx>=0.28,<1",
  "qqbot-agent-sdk==1.2.2",
  "tzdata>=2025.2",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
r-agent = "r_agent.cli:main"
r-agent-memory-eval = "r_agent.model_memory_eval_cli:main"
r-agent-official-owner-capture = "r_agent.official_qq_owner_capture_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/r_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["，", "："]
