name: higgs

services:
  napcat:
    image: ${NAPCAT_IMAGE:?Set NAPCAT_IMAGE to a pinned v4.18.13 digest}
    restart: unless-stopped
    environment:
      NAPCAT_UID: ${HOST_UID:-1000}
      NAPCAT_GID: ${HOST_GID:-1000}
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-16099}:6099"
    volumes:
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/napcat/qq:/app/.config/QQ
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/napcat/config:/app/napcat/config
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/napcat/plugins:/app/napcat/plugins
    networks:
      - onebot
      - egress
    mem_limit: 1200m
    cpus: 1.25
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0BB9 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agent:
    image: ${HIGGS_IMAGE:?Set HIGGS_IMAGE to a versioned local image}
    build:
      context: ../../apps/r-agent
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.11-slim-bookworm}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.19}
    restart: unless-stopped
    depends_on:
      napcat:
        condition: service_healthy
    env_file:
      - ${HIGGS_CONFIG_DIR:-/srv/secrets/higgs}/higgs.env
    environment:
      R_AGENT_ENV_FILE: /run/higgs-config/higgs.env
      R_AGENT_ONEBOT_TRUSTED_HOST: napcat
      R_AGENT_ONEBOT_WS_URL: ws://napcat:3001
      R_AGENT_DATA_DIR: /var/lib/higgs
      R_AGENT_HEALTH_FILE: /var/lib/higgs/health.json
      R_AGENT_PERSONA_FILE: /run/higgs/persona.md
    volumes:
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/agent:/var/lib/higgs
      - ${HIGGS_CONFIG_DIR:-/srv/secrets/higgs}:/run/higgs-config
      - ${HIGGS_PERSONA_FILE:-/srv/secrets/higgs/persona.md}:/run/higgs/persona.md:ro
    networks:
      - onebot
      - egress
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-m", "r_agent.health_probe", "--path", "/var/lib/higgs/health.json", "--max-age", "90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *bounded-logs

networks:
  onebot:
    internal: true
  egress: