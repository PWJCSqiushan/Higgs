services:
  agent:
    depends_on:
      official-qq-sidecar:
        condition: service_healthy
    # In dual-channel mode an offline personal QQ must not make the whole
    # Agent unhealthy while the official Gateway remains available.  The
    # base probe still verifies a fresh Agent heartbeat, OneBot reachability,
    # and the NapCat container marker; only the authoritative personal-QQ
    # online requirement is removed by this overlay.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "r_agent.health_probe",
          "--path",
          "/var/lib/higgs/health.json",
          "--max-age",
          "90",
        ]
    environment:
      R_AGENT_OFFICIAL_QQ_TRANSPORT: sidecar
      R_AGENT_OFFICIAL_QQ_SIDECAR_SOCKET: /run/higgs-official/sidecar.sock
    volumes:
      # Same UID as the sidecar, but mounted read-only so the Agent can connect
      # without replacing or removing the socket inode.
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/official-qq-runtime:/run/higgs-official:ro

  official-qq-sidecar:
    profiles: ["official-qq"]
    image: ${HIGGS_OFFICIAL_QQ_IMAGE:?Set HIGGS_OFFICIAL_QQ_IMAGE to an immutable local release tag}
    build:
      context: ../../apps/official-qq-sidecar
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${HIGGS_OFFICIAL_QQ_NODE_IMAGE:?Set HIGGS_OFFICIAL_QQ_NODE_IMAGE to a pinned Node image digest}
    restart: "on-failure:5"
    env_file:
      - ${HIGGS_CONFIG_DIR:-/srv/secrets/higgs}/official-qq.env
    environment:
      HIGGS_OFFICIAL_QQ_SOCKET: /run/higgs-official/sidecar.sock
      HIGGS_OFFICIAL_QQ_SESSION_FILE: /var/lib/higgs-official/session.json
      HIGGS_OFFICIAL_QQ_DELIVERY_STATE_FILE: /var/lib/higgs-official/delivery-state.json
    networks:
      - egress
    user: "10001:10001"
    read_only: true
    volumes:
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/official-qq-runtime:/run/higgs-official
      - ${HIGGS_DATA_ROOT:-/srv/data/higgs}/official-qq-private:/var/lib/higgs-official
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "src/health.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
