name: Higgs CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/r-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: apps/r-agent/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate release archive and secret boundaries
        working-directory: .
        run: python tools/release_gate.py
      - name: Validate release shell syntax
        working-directory: .
        run: |
          bash -n deploy/server/activate_release.sh
          bash -n deploy/server/rollback_release.sh
          bash -n deploy/existing-server/prepare_official_qq_runtime.sh
          bash -n deploy/existing-server/run_official_node_owner_bind.sh
          bash -n deploy/existing-server/run_official_node_private_capture.sh
          bash -n deploy/existing-server/freeze_official_private_users.sh
          bash -n deploy/existing-server/observe_official_stability.sh
          bash -n deploy/existing-server/run_official_node_group_bind.sh
          bash -n deploy/existing-server/activate_official_test_group.sh
          bash -n deploy/existing-server/activate_official_owner_proactive.sh
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q --junitxml=pytest-report.xml
      - name: Require zero skipped tests on Linux
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"Linux CI unexpectedly skipped {skipped} tests")
          print("linux-skips=0")
          PY

  official-qq-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/official-qq-sidecar
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/official-qq-sidecar/package-lock.json
      - name: Install fixed production dependency graph
        run: npm ci --omit=optional --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test fail-closed sidecar boundary
        run: npm test
      - name: Build isolated sidecar image
        run: >-
          docker build
          --build-arg NODE_IMAGE=node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
          --tag higgs-official-qq:ci .
      - name: Validate opt-in Compose overlay
        working-directory: .
        run: |
          mkdir -p /tmp/higgs-ci-config
          : > /tmp/higgs-ci-config/higgs.env
          cp deploy/existing-server/official-qq.env.example /tmp/higgs-ci-config/official-qq.env
          HIGGS_CONFIG_DIR=/tmp/higgs-ci-config \
          HIGGS_IMAGE=higgs-agent:ci \
          NAPCAT_IMAGE=napcat:ci \
          NAPCAT_ACCOUNT=10000 \
          NAPCAT_WEBUI_TOKEN=ci-only-placeholder \
          NAPCAT_ONEBOT_TOKEN=ci-only-placeholder \
          HIGGS_OFFICIAL_QQ_IMAGE=higgs-official-qq:ci \
          HIGGS_OFFICIAL_QQ_NODE_IMAGE=node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
          docker compose \
            -f deploy/existing-server/compose.yml \
            -f deploy/existing-server/compose.official-qq.yml \
            --profile official-qq config --quiet
