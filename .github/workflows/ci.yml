name: Higgs CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/r-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: apps/r-agent/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Validate release archive and secret boundaries
        working-directory: .
        run: python tools/release_gate.py
      - name: Validate release shell syntax
        working-directory: .
        run: |
          bash -n deploy/server/activate_release.sh
          bash -n deploy/server/rollback_release.sh
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q --junitxml=pytest-report.xml
      - name: Require zero skipped tests on Linux
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"Linux CI unexpectedly skipped {skipped} tests")
          print("linux-skips=0")
          PY
